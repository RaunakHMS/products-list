specVersion: "4.0"
metadata:
  name: test
type: application
framework:
  name: SAPUI5
  version: 1.147.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
      optional: false
server:
  customMiddleware:
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
        debug: true
        extraExts: xml,json,properties
        path: webapp